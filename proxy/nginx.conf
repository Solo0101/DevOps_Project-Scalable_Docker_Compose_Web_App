# =============================================================================
# Nginx Reverse Proxy / Load Balancer
# Distributes API requests across multiple backend replicas (round-robin)
# =============================================================================

upstream backend_pool {
    # Docker Compose DNS resolves 'backend' to all backend containers
    # Round-robin is the default load balancing algorithm
    server backend:5000;
}

server {
    listen 8080;
    server_name localhost;

    # API reverse proxy - forward to backend pool
    location / {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Health check endpoint - verify proxy itself is working
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Backend health check passthrough (for Docker health checks)
    location /healthz {
        proxy_pass http://backend_pool/healthz;
        proxy_set_header Host $host;
    }
}
